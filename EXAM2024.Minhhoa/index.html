<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task List</title>
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="container py-4">

        <!-- CARD CHÍNH -->
        <div class="card shadow-sm">
            <div class="card-body">

                <!-- HEADER -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 class="fw-bold mb-0">Task List</h2>
                    <button class="btn btn-dark btn-sm px-3" id="btnMoForm" style="background-color: indigo;">
                        + Add Task
                    </button>
                </div>

                <!-- DANH SÁCH TASK -->
                <div id="taskList">
                    <div class="task-item d-flex align-items-center gap-3">
                        <div class="task-label" style="min-width:140px">Task
                            <div class="task-name fw-bold" style="color: black;">Go to gym</div>
                        </div>

                        <div class="task-label" style="min-width:80px">Priority
                            <div class="task-name" style="color: red;">High</div>
                        </div>

                        <span class="badge-status me-auto">To do</span>

                        <button class="btn btn-warning" title="Edit">Sửa</button>
                        <button class="btn btn-danger" title="Delete">Xóa</button>
                    </div>
                    <div class="task-item d-flex align-items-center gap-3">
                        <div class="task-label" style="min-width:140px">Task
                            <div class="task-name fw-bold" style="color: black;">Read a book</div>
                        </div>

                        <div class="task-label" style="min-width:80px">Priority
                            <div class="task-name" style="color: green;">Low</div>
                        </div>

                        <span class="badge-status me-auto">Done</span>

                        <button class="btn btn-warning" title="Edit">Sửa</button>
                        <button class="btn btn-danger" title="Delete">Xóa</button>
                    </div>
                    <div class="task-item d-flex align-items-center gap-3">
                        <div class="task-label" style="min-width:140px">Task
                            <div class="task-name fw-bold" style="color: black;">Go to market</div>
                        </div>

                        <div class="task-label" style="min-width:80px">Priority
                            <div class="task-name" style="color:gold;">Medium</div>
                        </div>

                        <span class="badge-status me-auto">In progress</span>

                        <button class="btn btn-warning" title="Edit">Sửa</button>
                        <button class="btn btn-danger" title="Delete">Xóa</button>
                    </div>

                </div>

            </div>
        </div>

        <!-- FORM THÊM TASK -->
        <div class="card shadow-sm mt-3" id="formCard" style="display:none;">
            <div class="card-body">

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h6 class="fw-bold mb-0">Add Task</h6>
                    <button type="button" class="btn-close" id="btnDongForm"></button>
                </div>

                <form id="formTask">
                    <!-- Task name -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Task</label>
                        <input type="text" class="form-control" id="inputTask" placeholder="Type your task here..." />
                        <!-- Thông báo lỗi validation -->
                        <div id="errorTask" class="text-danger small mt-1" style="display:none;"></div>
                    </div>

                    <!-- Priority -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Priority</label>
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-sm btn-priority"
                                style="color: red; background-color: white; border-color: red;"
                                id="btnHigh">High</button>
                            <button type="button" class="btn btn-sm btn-priority"
                                style="color: gold; background-color: white; border-color: gold;"
                                id="btnMedium">Medium</button>
                            <button type="button" class="btn btn-sm btn-priority"
                                style="color: green; background-color: white; border-color: green;"
                                id="btnLow">Low</button>
                        </div>
                    </div>

                    <div class="text-end">
                        <button type="submit" class="btn btn-dark btn-sm px-4"
                            style="background-color: gray;">Add</button>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <script src="js/bootstrap.bundle.js" defer></script>
    <script src="main.js"></script>
</body>

</html>
